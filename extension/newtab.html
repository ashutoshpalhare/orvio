<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApratimTab</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { color-scheme: dark }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background:
          radial-gradient(1200px 800px at 10% -10%, #2a2450 0%, transparent 50%),
          radial-gradient(1000px 700px at 100% 10%, #4a1e2c 0%, transparent 55%),
          linear-gradient(180deg, #12132a 0%, #0a0b1e 100%);
        color: #f5f6ff;
      }
      .card {
        max-width: 420px;
        padding: 32px;
        border-radius: 24px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255,255,255,0.08);
        text-align: center;
      }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(135deg, #7c7bff, #ff6b8a);
        display: grid; place-items: center;
        font-weight: 700; font-size: 28px;
        color: white;
      }
      a { color: #a8b0ff }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">A</div>
      <h1 style="margin:0 0 6px;font-size:20px">ApratimTab</h1>
      <p style="margin:0;color:#a8adcf;font-size:14px">
        Full dashboard is served from your ApratimTab web build.
        Deploy the app and update <code>newtab.html</code> to redirect there,
        or run the packaged build to embed the bundle directly.
      </p>
    </div>
  </body>
</html>
