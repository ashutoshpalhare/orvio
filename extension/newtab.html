<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApratimTab</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { color-scheme: dark }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background:
          radial-gradient(1200px 800px at 10% -10%, #2a2450 0%, transparent 50%),
          radial-gradient(1000px 700px at 100% 10%, #4a1e2c 0%, transparent 55%),
          linear-gradient(180deg, #12132a 0%, #0a0b1e 100%);
        color: #f5f6ff;
      }
      #frame { width: 100%; height: 100vh; border: 0; display: block; }
      #setup { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card {
        max-width: 460px; width: 100%;
        padding: 32px; border-radius: 24px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(135deg, #7c7bff, #ff6b8a);
        display: grid; place-items: center;
        font-weight: 700; font-size: 28px; color: white;
      }
      h1 { margin: 0 0 8px; font-size: 20px; text-align: center; }
      p { margin: 0 0 16px; color: #a8adcf; font-size: 14px; text-align: center; }
      input {
        width: 100%; padding: 12px 14px; border-radius: 12px;
        background: rgba(255,255,255,0.06); color: #f5f6ff;
        border: 1px solid rgba(255,255,255,0.12); font-size: 14px;
        box-sizing: border-box; margin-bottom: 12px;
      }
      button {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 0;
        background: linear-gradient(135deg, #7c7bff, #ff6b8a);
        color: white; font-weight: 600; font-size: 14px; cursor: pointer;
      }
      .hint { font-size: 12px; color: #8a90b8; margin-top: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <iframe id="frame" style="display:none" allow="clipboard-read; clipboard-write; geolocation; camera; microphone"></iframe>
    <div id="setup" style="display:none">
      <div class="card">
        <div class="logo">A</div>
        <h1>Welcome to ApratimTab</h1>
        <p>Enter the URL where your ApratimTab dashboard is hosted.</p>
        <input id="url" type="url" placeholder="https://your-apratimtab.lovable.app" />
        <button id="save">Save & Open</button>
        <div class="hint">You can change this later from chrome://extensions → ApratimTab.</div>
      </div>
    </div>
    <script>
      (function () {
        const KEY = "apratimtab:dashboardUrl";
        const frame = document.getElementById("frame");
        const setup = document.getElementById("setup");
        const input = document.getElementById("url");
        const save = document.getElementById("save");

        function showFrame(url) {
          setup.style.display = "none";
          frame.style.display = "block";
          frame.src = url;
        }
        function showSetup() {
          frame.style.display = "none";
          setup.style.display = "block";
          setTimeout(function () { input.focus(); }, 50);
        }

        function load(cb) {
          if (window.chrome && chrome.storage && chrome.storage.local) {
            chrome.storage.local.get(KEY, function (r) { cb(r && r[KEY]); });
          } else {
            cb(localStorage.getItem(KEY));
          }
        }
        function persist(url) {
          if (window.chrome && chrome.storage && chrome.storage.local) {
            chrome.storage.local.set({ [KEY]: url });
          } else {
            localStorage.setItem(KEY, url);
          }
        }

        save.addEventListener("click", function () {
          let v = (input.value || "").trim();
          if (!v) return;
          if (!/^https?:\/\//i.test(v)) v = "https://" + v;
          persist(v);
          showFrame(v);
        });
        input && input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") save.click();
        });

        load(function (url) {
          if (url) showFrame(url); else showSetup();
        });
      })();
    </script>
  </body>
</html>
